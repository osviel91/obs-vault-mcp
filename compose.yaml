name: obsidian-knowledge

services:
  vault-init:
    image: rclone/rclone:latest
    container_name: obsidian-vault-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        REMOTE="naswebdav:"
        if [ -n "${WEBDAV_REMOTE_PATH}" ]; then
          REMOTE="naswebdav:${WEBDAV_REMOTE_PATH}"
        fi
        set -- rclone sync "$$REMOTE" /vault \
          --create-empty-src-dirs \
          --delete-during \
          --exclude "/.markdown_vault_mcp/**" \
          --exclude "/.git/**" \
          --exclude "/.trash/**" \
          --transfers 4 \
          --checkers 8 \
          --retries 5 \
          --low-level-retries 10 \
          --log-level INFO
        if [ "${WEBDAV_NO_CHECK_CERTIFICATE}" = "true" ]; then
          set -- "$$@" --no-check-certificate
        fi
        echo "Performing initial WebDAV synchronization..."
        "$$@"
        date -Iseconds > /vault/.webdav-sync-ready
        echo "Initial synchronization completed."
    environment:
      RCLONE_CONFIG_NASWEBDAV_TYPE: webdav
      RCLONE_CONFIG_NASWEBDAV_URL: ${WEBDAV_URL}
      RCLONE_CONFIG_NASWEBDAV_VENDOR: ${WEBDAV_VENDOR}
      RCLONE_CONFIG_NASWEBDAV_USER: ${WEBDAV_USERNAME}
      RCLONE_CONFIG_NASWEBDAV_PASS: ${WEBDAV_PASSWORD_OBSCURED}
      WEBDAV_REMOTE_PATH: ${WEBDAV_REMOTE_PATH}
      WEBDAV_NO_CHECK_CERTIFICATE: ${WEBDAV_NO_CHECK_CERTIFICATE}
    volumes:
      - vault-data:/vault
    networks:
      - knowledge-net

  vault-sync:
    image: rclone/rclone:latest
    container_name: obsidian-vault-sync
    restart: unless-stopped
    depends_on:
      vault-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        REMOTE="naswebdav:"
        REQUEST_FILE="/control/request-sync"
        if [ -n "${WEBDAV_REMOTE_PATH}" ]; then
          REMOTE="naswebdav:${WEBDAV_REMOTE_PATH}"
        fi
        set -- rclone sync "$$REMOTE" /vault \
          --create-empty-src-dirs \
          --delete-during \
          --exclude "/.markdown_vault_mcp/**" \
          --exclude "/.git/**" \
          --exclude "/.trash/**" \
          --transfers 4 \
          --checkers 8 \
          --retries 5 \
          --low-level-retries 10 \
          --log-level INFO
        if [ "${WEBDAV_NO_CHECK_CERTIFICATE}" = "true" ]; then
          set -- "$$@" --no-check-certificate
        fi
        sync_once() {
          echo "Synchronizing vault from WebDAV..."
          if "$$@"; then
              date -Iseconds > /vault/.webdav-sync-ready
              echo "Synchronization completed."
          else
              echo "Synchronization failed; preserving the previous local mirror."
          fi
        }
        LAST_REQUEST=""
        NEXT_SYNC_EPOCH=$$(($$(date +%s) + $${SYNC_INTERVAL_SECONDS}))
        while true; do
          CURRENT_REQUEST=""
          if [ -f "$$REQUEST_FILE" ]; then
            CURRENT_REQUEST=$$(cat "$$REQUEST_FILE" 2>/dev/null || true)
          fi
          NOW=$$(date +%s)
          if [ -n "$$CURRENT_REQUEST" ] && [ "$$CURRENT_REQUEST" != "$$LAST_REQUEST" ]; then
            echo "Detected writer sync request: $$CURRENT_REQUEST"
            echo "Waiting 240s for the WebDAV source to settle before syncing..."
            sleep 240
            sync_once
            echo "Running a follow-up sync to catch late-arriving listings..."
            sleep 60
            sync_once
            LAST_REQUEST="$$CURRENT_REQUEST"
            NEXT_SYNC_EPOCH=$$(($$NOW + $${SYNC_INTERVAL_SECONDS}))
            continue
          fi
          if [ "$$NOW" -ge "$$NEXT_SYNC_EPOCH" ]; then
            sync_once
            NEXT_SYNC_EPOCH=$$(($$(date +%s) + $${SYNC_INTERVAL_SECONDS}))
            continue
          fi
          sleep 1
        done
    environment:
      RCLONE_CONFIG_NASWEBDAV_TYPE: webdav
      RCLONE_CONFIG_NASWEBDAV_URL: ${WEBDAV_URL}
      RCLONE_CONFIG_NASWEBDAV_VENDOR: ${WEBDAV_VENDOR}
      RCLONE_CONFIG_NASWEBDAV_USER: ${WEBDAV_USERNAME}
      RCLONE_CONFIG_NASWEBDAV_PASS: ${WEBDAV_PASSWORD_OBSCURED}
      WEBDAV_REMOTE_PATH: ${WEBDAV_REMOTE_PATH}
      WEBDAV_NO_CHECK_CERTIFICATE: ${WEBDAV_NO_CHECK_CERTIFICATE}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS}
    volumes:
      - vault-data:/vault
      - sync-control:/control
    networks:
      - knowledge-net

  markdown-vault-mcp:
    image: ghcr.io/pvliesdonk/markdown-vault-mcp:latest
    container_name: markdown-vault-mcp
    restart: unless-stopped
    depends_on:
      vault-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec markdown-vault-mcp serve
        --transport http
        --host 0.0.0.0
        --port 8000
        --http-path /mcp
    environment:
      MARKDOWN_VAULT_MCP_SOURCE_DIR: /data/vault
      MARKDOWN_VAULT_MCP_READ_ONLY: "true"
      MARKDOWN_VAULT_MCP_FILE_WATCHER: "false"
      MARKDOWN_VAULT_MCP_INDEX_PATH: /data/state/index.db
      MARKDOWN_VAULT_MCP_EMBEDDINGS_PATH: /data/state/embeddings
      MARKDOWN_VAULT_MCP_KV_STORE_URL: file:///data/state/kv
      MARKDOWN_VAULT_MCP_EXCLUDE: ".obsidian/**,.trash/**,.git/**,.webdav-sync-ready"
      MARKDOWN_VAULT_MCP_EMBEDDING_PROVIDER: fastembed
      MARKDOWN_VAULT_MCP_FASTEMBED_MODEL: BAAI/bge-small-en-v1.5
      MARKDOWN_VAULT_MCP_FASTEMBED_CACHE_DIR: /data/state/fastembed
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - vault-data:/data/vault
      - mcp-state:/data/state
    ports:
      - "8019:8000"
    networks:
      - knowledge-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import socket;
          s = socket.create_connection(('127.0.0.1', 8000), timeout=5);
          s.close()"
          >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  vault-writer-mcp:
    build:
      context: ./vault-writer-mcp
    container_name: vault-writer-mcp
    restart: unless-stopped
    environment:
      RCLONE_CONFIG_NASWEBDAV_TYPE: webdav
      RCLONE_CONFIG_NASWEBDAV_URL: ${WEBDAV_URL}
      RCLONE_CONFIG_NASWEBDAV_VENDOR: ${WEBDAV_VENDOR}
      RCLONE_CONFIG_NASWEBDAV_USER: ${WEBDAV_USERNAME}
      RCLONE_CONFIG_NASWEBDAV_PASS: ${WEBDAV_PASSWORD_OBSCURED}
      WEBDAV_REMOTE_PATH: ${WEBDAV_REMOTE_PATH}
      WEBDAV_NO_CHECK_CERTIFICATE: ${WEBDAV_NO_CHECK_CERTIFICATE}
      CURATOR_ARCHIVE_ROOT: ${CURATOR_ARCHIVE_ROOT}
      CURATOR_ALLOW_HARD_DELETE: ${CURATOR_ALLOW_HARD_DELETE}
      SYNC_REQUEST_FILE: /control/request-sync
      PORT: 8000
    ports:
      - "8020:8000"
    volumes:
      - sync-control:/control
    networks:
      - knowledge-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
          >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  knowledge-net:
    name: obsidian-knowledge-net

volumes:
  vault-data:
    name: obsidian-knowledge-vault
  mcp-state:
    name: obsidian-knowledge-mcp-state
  sync-control:
    name: obsidian-knowledge-sync-control
